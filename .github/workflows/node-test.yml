name: Test

# unit —— 纯逻辑，不打网络，必须绿
# live —— 真去 Bing 搜一次，只手动触发（GitHub runner 在境外，cn.bing.com 会 302）
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: node --input-type=module --check < index.js
      - name: Unit tests (offline)
        env:
          SKIP_LIVE: '1'
        run: node --test test/provider.test.mjs

  live:
    name: live network probes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Live tests (hits real search engines)
        run: node --test test/provider.test.mjs
